<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert any document to Markdown using Microsoft MarkItDown" />
    <title>MarkItDown UI</title>
    <!-- Theme FOUC prevention: apply saved theme before first paint -->
    <script>
      ;(function () {
        var stored = localStorage.getItem('theme')
        var prefer = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var theme = stored === 'light' || stored === 'dark' ? stored : prefer
        if (theme === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
